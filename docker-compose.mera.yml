name: airlink3-prod

# Production stack — optimized builds, code baked into images, no dev bind mounts.
#   docker compose -f docker-compose.mera.yml up -d --build
# Serves the SPA + API on http://localhost:${WEB_PORT:-8090} (nginx → php-fpm).
# Uses its own DB volume and internal-only DB/RADIUS ports so it can run
# alongside the dev stack.

services:
  mariadb:
    image: mariadb:11
    container_name: airlink-mera-prod-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MARIADB_DATABASE: airlink_mera
      MARIADB_USER: airlink
      MARIADB_PASSWORD: ${DB_PASSWORD:-airlink_pass}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mariadb_prod_data:/var/lib/mysql
      - ./docker/mariadb/initdb.d:/docker-entrypoint-initdb.d:ro
      - ./nalrd_backup.sql:/legacy/nalrd_backup.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.prod
    container_name: airlink-mera-prod-app
    restart: unless-stopped
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: airlink_mera
      DB_USERNAME: airlink
      DB_PASSWORD: ${DB_PASSWORD:-airlink_pass}
      LEGACY_DB_HOST: mariadb
      LEGACY_DB_PORT: 3306
      LEGACY_DB_DATABASE: ${LEGACY_DB_DATABASE:-airlink_legacy}
      LEGACY_DB_USERNAME: airlink
      LEGACY_DB_PASSWORD: ${DB_PASSWORD:-airlink_pass}
      APP_KEY: ${APP_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: 1
      # FreeRADIUS runs as the `freeradius` compose service (see below),
      # reached by its service name on the internal docker network.
      RADIUS_HOST: freeradius
      RADIUS_PORT: 1812
      RADIUS_SECRET: ${RADIUS_DOCKER_NETWORKS_SECRET}
      RADIUS_CLIENTS_CONF_PATH: /var/lib/airlink-radius/clients.conf
      RADIUS_RESTART_TRIGGER_PATH: /var/lib/airlink-radius/.restart-trigger
    volumes:
      # Shared with the freeradius container: clients.conf (this app edits
      # it via ClientsConfService) and the restart-trigger it touches
      # afterward. Server log, read-only — backs the RADIUS Log tab.
      - radius_shared:/var/lib/airlink-radius
      - radius_logs:/var/log/freeradius:ro
    depends_on:
      mariadb:
        condition: service_healthy
      freeradius:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: airlink-mera-prod-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:80"
    depends_on:
      - app

  queue:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.prod
    container_name: airlink-mera-prod-queue
    restart: unless-stopped
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: airlink_mera
      DB_USERNAME: airlink
      DB_PASSWORD: ${DB_PASSWORD:-airlink_pass}
      LEGACY_DB_HOST: mariadb
      LEGACY_DB_PORT: 3306
      LEGACY_DB_DATABASE: ${LEGACY_DB_DATABASE:-airlink_legacy}
      LEGACY_DB_USERNAME: airlink
      LEGACY_DB_PASSWORD: ${DB_PASSWORD:-airlink_pass}
      APP_KEY: ${APP_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: 0
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120"]
    depends_on:
      - app

  scheduler:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.prod
    container_name: airlink-mera-prod-scheduler
    restart: unless-stopped
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: airlink_mera
      DB_USERNAME: airlink
      DB_PASSWORD: ${DB_PASSWORD:-airlink_pass}
      LEGACY_DB_HOST: mariadb
      LEGACY_DB_PORT: 3306
      LEGACY_DB_DATABASE: ${LEGACY_DB_DATABASE:-airlink_legacy}
      LEGACY_DB_USERNAME: airlink
      LEGACY_DB_PASSWORD: ${DB_PASSWORD:-airlink_pass}
      APP_KEY: ${APP_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: 0
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - app

  # Re-enabled 2026-08-14 — no host-installed FreeRADIUS exists on this box
  # (this is the Docker-based replica of the sibling VPS's setup, prepping
  # for a future full migration). Config baked from scripts/radius-replica's
  # exported bundle; see docker/freeradius/.
  freeradius:
    build:
      context: ./docker/freeradius
    container_name: airlink-prod-freeradius
    restart: unless-stopped
    environment:
      TZ: Asia/Kathmandu
    ports:
      - "${PROD_RADIUS_AUTH_PORT:-1812}:1812/udp"
      - "${PROD_RADIUS_ACCT_PORT:-1813}:1813/udp"
    volumes:
      - radius_shared:/var/lib/airlink-radius
      - radius_logs:/var/log/freeradius
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      # `default` must be listed explicitly — naming any network here opts
      # the service out of joining the stack default implicitly, and app/
      # mariadb reach freeradius over it.
      - default
      # Shared with the Annapurna stack: lets this one FreeRADIUS reach
      # Annapurna's own MariaDB, and lets Annapurna's backend reach this
      # server. Fixed subnet so the `annapurna_docker` client stanza can
      # match Annapurna's containers by address.
      - tenant_link
    healthcheck:
      test: ["CMD", "pgrep", "-x", "freeradius"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      mariadb:
        condition: service_healthy

networks:
  default:
  # Cross-tenant link network. Owned by this stack (it holds the shared
  # FreeRADIUS); the Annapurna stack declares it `external: true`.
  # 172.31.0.0/16 sits inside the 172.16.0.0/12 that Mera's
  # `client docker_networks` covers, and FreeRADIUS matches clients by
  # longest prefix, so the /16 `annapurna_docker` entry wins for Annapurna.
  # Shared infrastructure, owned by NEITHER stack — the Annapurna stack
  # attaches to the same network, so whichever stack came down last must not
  # be able to delete it. Create it once, by hand:
  #
  #   docker network create airlink_tenant_link --subnet 172.31.0.0/16
  #
  tenant_link:
    name: airlink_tenant_link
    external: true

volumes:
  mariadb_prod_data:
  radius_shared:
  radius_logs:


name: airlink3-prod

# Production stack — optimized builds, code baked into images, no dev bind mounts.
#   docker compose -f docker-compose.prod.yml up -d --build
# Serves the SPA + API on http://localhost:${WEB_PORT:-8090} (nginx → php-fpm).
# Uses its own DB volume and internal-only DB/RADIUS ports so it can run
# alongside the dev stack.

services:
  mariadb:
    image: mariadb:11
    container_name: airlink-prod-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MARIADB_DATABASE: airlink
      MARIADB_USER: airlink
      MARIADB_PASSWORD: ${DB_PASSWORD:-airlink_pass}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mariadb_prod_data:/var/lib/mysql
      - ./docker/mariadb/initdb.d:/docker-entrypoint-initdb.d:ro
      - ./nalrd_backup.sql:/legacy/nalrd_backup.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.prod
    container_name: airlink-prod-app
    restart: unless-stopped
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: airlink
      DB_USERNAME: airlink
      DB_PASSWORD: ${DB_PASSWORD:-airlink_pass}
      LEGACY_DB_HOST: mariadb
      LEGACY_DB_PORT: 3306
      LEGACY_DB_DATABASE: ${LEGACY_DB_DATABASE:-narld}
      LEGACY_DB_USERNAME: airlink
      LEGACY_DB_PASSWORD: ${DB_PASSWORD:-airlink_pass}
      APP_KEY: ${APP_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: 1
      # FreeRADIUS runs on the Docker host (systemd), not as a compose
      # service — reach it via the host-gateway alias below.
      RADIUS_HOST: host.docker.internal
      RADIUS_PORT: 1812
      RADIUS_SECRET: ${RADIUS_DOCKER_NETWORKS_SECRET}
      RADIUS_CLIENTS_CONF_PATH: /etc/freeradius-host/clients.conf
      RADIUS_RESTART_TRIGGER_PATH: /etc/freeradius-host/.restart-trigger
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/freeradius/3.0/clients.conf:/etc/freeradius-host/clients.conf
      - /etc/freeradius/3.0/.restart-trigger:/etc/freeradius-host/.restart-trigger
    depends_on:
      mariadb:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: airlink-prod-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:80"
    depends_on:
      - app

  queue:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.prod
    container_name: airlink-prod-queue
    restart: unless-stopped
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: airlink
      DB_USERNAME: airlink
      DB_PASSWORD: ${DB_PASSWORD:-airlink_pass}
      LEGACY_DB_HOST: mariadb
      LEGACY_DB_PORT: 3306
      LEGACY_DB_DATABASE: ${LEGACY_DB_DATABASE:-narld}
      LEGACY_DB_USERNAME: airlink
      LEGACY_DB_PASSWORD: ${DB_PASSWORD:-airlink_pass}
      APP_KEY: ${APP_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: 0
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120"]
    depends_on:
      - app

  scheduler:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.prod
    container_name: airlink-prod-scheduler
    restart: unless-stopped
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: airlink
      DB_USERNAME: airlink
      DB_PASSWORD: ${DB_PASSWORD:-airlink_pass}
      LEGACY_DB_HOST: mariadb
      LEGACY_DB_PORT: 3306
      LEGACY_DB_DATABASE: ${LEGACY_DB_DATABASE:-narld}
      LEGACY_DB_USERNAME: airlink
      LEGACY_DB_PASSWORD: ${DB_PASSWORD:-airlink_pass}
      APP_KEY: ${APP_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: 0
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - app

  # freeradius: disabled 2026-07-25 — the host's systemd freeradius
  # (/etc/freeradius/3.0) is now the canonical RADIUS server, pointed at
  # this same mariadb service via 127.0.0.1:3308, and owns UDP 1812/1813
  # on the host. Re-enabling this service will conflict with it for those
  # ports. See /etc/freeradius/3.0 for the current config.
  # freeradius:
  #   build:
  #     context: ./docker/freeradius
  #   container_name: airlink-prod-freeradius
  #   restart: unless-stopped
  #   ports:
  #     - "${PROD_RADIUS_AUTH_PORT:-18121}:1812/udp"
  #     - "${PROD_RADIUS_ACCT_PORT:-18131}:1813/udp"
  #   depends_on:
  #     mariadb:
  #       condition: service_healthy

volumes:
  mariadb_prod_data:

